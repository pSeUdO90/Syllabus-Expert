<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practice — Syllabus Expert</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
  <style>
:root {
  --bg: #12151c;
  --panel: #1a1f2b;
  --panel-2: #222836;
  --line: #2d3548;
  --text: #eef2f8;
  --muted: #9aa6b8;
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.16);
  --amber: #f5c542;
  --blue: #5b8cff;
  --blue-dim: rgba(91, 140, 255, 0.16);
  --red: #f87171;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }
.wrap.wide { max-width: 1120px; }

.site-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(18, 21, 28, 0.92);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 750;
  letter-spacing: -0.03em;
  text-decoration: none;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, #22c55e, #5b8cff);
  display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #06210f;
}
.site-nav nav { display: flex; gap: 6px; flex-wrap: wrap; }
.site-nav nav a {
  text-decoration: none;
  color: var(--muted);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
}
.site-nav nav a:hover, .site-nav nav a.active {
  background: var(--panel-2);
  color: var(--text);
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: flex-start;
}
h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -0.03em; }
h2 { margin: 0 0 8px; font-size: 22px; }
.lede { color: var(--muted); max-width: 62ch; line-height: 1.55; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title-row h2 { margin: 0; font-size: 20px; font-weight: 650; }
.icon-btn, .btn, .ghost {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.icon-btn {
  width: 32px; height: 32px; justify-content: center; padding: 0; color: var(--muted);
}
.icon-btn:hover, .ghost:hover { background: var(--panel-2); color: var(--text); }
.badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  padding: 4px 8px; border-radius: 6px; text-transform: uppercase;
}
.badge.draft { background: rgba(245, 197, 66, 0.16); color: var(--amber); }
.badge.published { background: var(--green-dim); color: var(--green); }
.meta { display: flex; gap: 18px; color: var(--muted); font-size: 13px; margin: 10px 0 16px; flex-wrap: wrap; align-items: center; }
.ai {
  background: var(--blue-dim); color: #9bb7ff; border-radius: 999px;
  padding: 4px 10px; font-size: 12px; font-weight: 650;
  display: inline-flex; align-items: center; gap: 6px;
}
.summary {
  border: 1px solid rgba(34, 197, 94, 0.45);
  background: var(--green-dim);
  color: #86efac;
  border-radius: 12px;
  padding: 12px 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  width: fit-content;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.ghost { padding: 10px 14px; }
.btn { padding: 10px 16px; }
.btn.primary {
  background: var(--green); color: #06210f; border-color: var(--green);
  font-weight: 700; padding: 10px 16px;
}
.btn.primary:hover { filter: brightness(1.05); }
.filters {
  margin-top: 22px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.filters .left, .pager { display: flex; gap: 10px; align-items: center; }
label.field { color: var(--muted); font-size: 12px; display: grid; gap: 6px; }
select, input[type="text"], input[type="search"], textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px; min-width: 170px; outline: none;
}
select:focus, input:focus, textarea:focus { border-color: var(--blue); }
.pager { color: var(--muted); }
.card {
  margin-top: 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px 8px;
}
.card-head h3 { margin: 0; font-size: 18px; }
.card-tools { display: flex; gap: 8px; }
.danger { color: var(--red); border-color: rgba(248, 113, 113, 0.35); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 22px 16px; align-items: center; }
.tag {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 650;
}
.tag.yellow { color: var(--amber); border-color: rgba(245, 197, 66, 0.35); background: rgba(245, 197, 66, 0.08); }
.tag.blue { color: #9bb7ff; border-color: rgba(91, 140, 255, 0.35); background: var(--blue-dim); }
.stem { padding: 4px 22px 18px; font-size: 16px; line-height: 1.55; }
.stem[contenteditable="true"], .opt-text[contenteditable="true"], .solution-body[contenteditable="true"] {
  outline: 1px dashed var(--blue); border-radius: 8px; padding: 8px;
}
.options { display: grid; gap: 10px; padding: 0 22px 22px; }
.opt {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  background: #171c27;
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
}
.opt.correct {
  border-color: rgba(34, 197, 94, 0.8);
  background: rgba(34, 197, 94, 0.08);
}
.opt.wrong {
  border-color: rgba(248, 113, 113, 0.8);
  background: rgba(248, 113, 113, 0.08);
}
.letter { color: var(--muted); font-weight: 700; }
.opt.correct .letter { color: var(--green); }
.opt.wrong .letter { color: var(--red); }
.check { width: 22px; height: 22px; color: var(--green); opacity: 0; }
.opt.correct .check { opacity: 1; }
.solution-toggle {
  width: 100%;
  border: 0;
  border-top: 1px solid var(--line);
  background: #161b26;
  color: var(--muted);
  padding: 14px 22px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.solution-body { display: none; padding: 0 22px 20px; color: #d5deea; line-height: 1.6; }
.solution-body.open { display: block; }
.katex { color: inherit; font-size: 1.08em; }
.katex-display { margin: 0.4em 0; overflow-x: auto; }
.edit-hint { color: var(--muted); font-size: 12px; padding: 0 22px 10px; }
.toast {
  position: fixed; bottom: 20px; right: 20px; background: var(--panel-2);
  border: 1px solid var(--line); padding: 12px 14px; border-radius: 12px;
  display: none; box-shadow: var(--shadow); z-index: 20;
}
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
  align-items: center; justify-content: center; z-index: 30; padding: 20px;
}
.modal {
  width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
}
.modal h3 { margin: 0 0 14px; }
.modal .grid { display: grid; gap: 10px; }
.modal textarea { min-height: 90px; resize: vertical; width: 100%; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.empty { padding: 48px 22px; text-align: center; color: var(--muted); }
.file-box {
  border: 1px dashed var(--line); border-radius: 12px; padding: 12px;
  background: #171c27;
}
.file-box strong { display: block; margin-bottom: 8px; }
.file-box input[type="file"] { width: 100%; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.overlay {
  position: fixed; inset: 0; background: rgba(8,10,16,.72); display: none;
  align-items: center; justify-content: center; z-index: 40; text-align: center;
}
.overlay.open { display: flex; }
.overlay .panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 28px 32px; box-shadow: var(--shadow); max-width: 420px;
}
.spinner {
  width: 28px; height: 28px; border: 3px solid var(--line);
  border-top-color: var(--green); border-radius: 50%;
  margin: 0 auto 12px; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.hero {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 32px;
  align-items: center;
  padding: 28px 0 12px;
}
.hero-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
}
.stat b { display: block; font-size: 28px; letter-spacing: -0.04em; }
.stat span { color: var(--muted); font-size: 13px; }
.features {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 28px;
}
.feature {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  text-decoration: none;
  min-height: 150px;
}
.feature:hover { border-color: var(--blue); }
.feature h3 { margin: 0 0 8px; font-size: 16px; }
.feature p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.steps { margin-top: 36px; display: grid; gap: 10px; }
.step {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 12px;
  align-items: start;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.step .n {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--blue-dim); color: #9bb7ff;
  display: grid; place-items: center; font-weight: 800;
}

.paper-list { display: grid; gap: 12px; margin-top: 18px; }
.paper-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
}
.paper-row h3 { margin: 0 0 6px; font-size: 17px; }
.paper-row .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.score-box {
  margin-top: 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px 22px;
  text-align: center;
}
.score-box .big { font-size: 48px; font-weight: 800; letter-spacing: -0.04em; }

@media (max-width: 900px) {
  .hero, .features { grid-template-columns: 1fr; }
  .paper-row { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <header class="site-nav">
    <a class="brand" href="index.html"><span class="brand-mark">SE</span> Syllabus Expert</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="upload.html">Upload</a>
      <a href="review.html">Review</a>
      <a href="practice.html">Practice</a>
    </nav>
  </header>
  <div class="wrap">
    <h1>Practice</h1>
    <p class="lede">Attempt a saved paper. Options stay hidden until you pick one. Score is shown at the end.</p>

    <section class="card" id="setup" style="padding:22px">
      <div class="filters" style="margin:0">
        <div class="left">
          <label class="field">Paper
            <select id="paper-select"></select>
          </label>
          <label class="field">Subject
            <select id="subject-filter"></select>
          </label>
        </div>
        <button class="btn primary" id="start-btn">Start practice</button>
      </div>
    </section>

    <section id="quiz" hidden>
      <div class="filters">
        <div class="summary" id="progress">0 / 0</div>
        <div class="pager">
          <button class="icon-btn" id="prev" title="Previous">‹</button>
          <span id="page-label">1 / 1</span>
          <button class="icon-btn" id="next" title="Next">›</button>
        </div>
      </div>
      <section class="card" id="card"></section>
      <div class="actions" style="margin-top:14px">
        <button class="ghost" id="finish-btn">Finish &amp; score</button>
      </div>
    </section>

    <section class="score-box" id="results" hidden>
      <div class="big" id="score">0%</div>
      <p id="score-detail" class="lede" style="margin:8px auto"></p>
      <div class="actions" style="justify-content:center;margin-top:16px">
        <button class="btn primary" id="retry-btn">Practice again</button>
        <a class="ghost" id="review-link" href="review.html">Review paper</a>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <script>
(function () {
  const file = (location.pathname.split("/").pop() || "index.html").replace(/\/$/, "") || "index.html";
  const current = file.replace(/\.html$/, "") || "index";
  document.querySelectorAll(".site-nav nav a[href]").forEach((a) => {
    const href = (a.getAttribute("href") || "").split("?")[0];
    const key = href.replace(/^.*\//, "").replace(/\.html$/, "") || "index";
    if (key === current || ((current === "index" || current === "") && key === "index")) {
      a.classList.add("active");
    }
  });
})();

window.SE = {
  root() {
    const parts = location.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "";
    const pages = new Set([
      "library", "library.html", "upload", "upload.html",
      "review", "review.html", "practice", "practice.html", "index.html",
    ]);
    if (pages.has(last) || last === "") parts.pop();
    return parts.length ? "/" + parts.join("/") : "";
  },
  url(path) {
    if (!path.startsWith("/")) path = "/" + path;
    return this.root() + path;
  },
  page(name, query) {
    const suffix = query ? (query.startsWith("?") ? query : "?" + query) : "";
    return name + suffix;
  },
  esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));
  },
  toast(msg) {
    let el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 2400);
  },
  typesetMath(root) {
    if (!window.renderMathInElement || !root) return;
    window.renderMathInElement(root, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
      ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
    });
  },
  async getJson(path) {
    const res = await fetch(this.url(path));
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || res.statusText);
    return payload;
  },
};

</script>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let papers = [];
    let paper = null;
    let items = [];
    let index = 0;
    let picks = {};
    let started = false;

    function currentItems() {
      const filter = $("subject-filter").value;
      const all = paper.mcqs || [];
      if (!filter || filter === "All Subjects") return all;
      return all.filter((q) => (q.subject || "General") === filter);
    }

    async function loadList() {
      papers = await SE.getJson("/api/papers");
      const wanted = params.get("id");
      $("paper-select").innerHTML = papers.map((p) =>
        `<option value="${p.id}" ${String(p.id) === String(wanted) ? "selected" : ""}>${SE.esc(p.title)} (${p.question_count})</option>`
      ).join("") || `<option value="">No papers yet</option>`;
      if (!papers.length) return;
      await loadPaper($("paper-select").value);
    }

    async function loadPaper(id) {
      paper = await SE.getJson("/api/paper?id=" + id);
      const subjects = ["All Subjects", ...new Set((paper.mcqs || []).map((q) => q.subject || "General"))];
      $("subject-filter").innerHTML = subjects.map((s) => `<option>${SE.esc(s)}</option>`).join("");
      $("review-link").href = "review.html?id=" + paper.id;
    }

    function renderCard() {
      const q = items[index];
      const card = $("card");
      if (!q) {
        card.innerHTML = `<div class="empty">No questions in this filter.</div>`;
        return;
      }
      const pick = picks[index];
      const locked = pick !== undefined;
      const opts = (q.options || []).map((opt) => {
        const letter = (opt.letter || "").toUpperCase();
        const correct = (q.answer || "").toUpperCase() === letter;
        let cls = "opt";
        if (locked && letter === pick) cls += correct ? " correct" : " wrong";
        if (locked && correct) cls += " correct";
        return `
          <div class="${cls}" data-letter="${SE.esc(letter)}">
            <span class="letter">${SE.esc(letter)}.</span>
            <div class="opt-text">${SE.esc(opt.text || "—")}</div>
            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
          </div>`;
      }).join("");
      card.innerHTML = `
        <div class="card-head"><h3>Question ${SE.esc(q.number || String(index + 1))}</h3></div>
        <div class="tags">
          <span class="tag blue">${SE.esc(q.subject || "General")}</span>
          <span class="tag">${SE.esc(q.topic || "")}</span>
        </div>
        <div class="stem">${SE.esc(q.question)}</div>
        <div class="options">${opts}</div>
        ${locked && q.explanation ? `<div class="solution-body open">${SE.esc(q.explanation)}</div>` : ""}
      `;
      card.querySelectorAll(".opt").forEach((el) => {
        el.onclick = () => {
          if (picks[index] !== undefined) return;
          picks[index] = el.dataset.letter;
          renderChrome();
          renderCard();
        };
      });
      SE.typesetMath(card);
    }

    function renderChrome() {
      const answered = Object.keys(picks).length;
      $("progress").textContent = `${answered} / ${items.length} ANSWERED`;
      $("page-label").textContent = items.length ? `${index + 1} / ${items.length}` : "0 / 0";
    }

    function start() {
      if (!paper || !(paper.mcqs || []).length) {
        SE.toast("Upload a paper first");
        return;
      }
      items = currentItems();
      if (!items.length) {
        SE.toast("No questions in that subject");
        return;
      }
      index = 0;
      picks = {};
      started = true;
      $("setup").hidden = true;
      $("results").hidden = true;
      $("quiz").hidden = false;
      renderChrome();
      renderCard();
    }

    function finish() {
      let correct = 0;
      items.forEach((q, i) => {
        if ((picks[i] || "").toUpperCase() === (q.answer || "").toUpperCase()) correct += 1;
      });
      const pct = items.length ? Math.round((correct / items.length) * 100) : 0;
      $("quiz").hidden = true;
      $("results").hidden = false;
      $("score").textContent = pct + "%";
      $("score-detail").textContent = `${correct} of ${items.length} correct. Unanswered questions count as incorrect.`;
    }

    $("paper-select").onchange = () => loadPaper($("paper-select").value);
    $("start-btn").onclick = start;
    $("finish-btn").onclick = finish;
    $("retry-btn").onclick = () => {
      $("results").hidden = true;
      $("setup").hidden = false;
    };
    $("prev").onclick = () => { index = Math.max(0, index - 1); renderChrome(); renderCard(); };
    $("next").onclick = () => { index = Math.min(items.length - 1, index + 1); renderChrome(); renderCard(); };
    document.addEventListener("keydown", (ev) => {
      if (!started || $("quiz").hidden) return;
      if (ev.key === "ArrowLeft") $("prev").click();
      if (ev.key === "ArrowRight") $("next").click();
    });
    window.addEventListener("load", () => { if (started) renderCard(); });

    loadList().catch((err) => SE.toast(String(err)));
  </script>
</body>
